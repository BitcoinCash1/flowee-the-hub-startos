name: Check Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new upstream Flowee release
        run: |
          set -euo pipefail
          LATEST=$(curl -s 'https://codeberg.org/api/v1/repos/Flowee/thehub/tags?limit=1' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['name'] if r else '')" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT=$(grep -E '^ARG FLOWEE_VERSION=' Dockerfile.binary | cut -d= -f2)
          if [ "$LATEST" = "$CURRENT" ]; then echo "Already at $LATEST — no update"; exit 0; fi

          echo "Updating $CURRENT -> $LATEST"
          bash scripts/auto-bump.sh "$LATEST"
        shell: bash
