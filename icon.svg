<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00acc1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <!-- Flow symbol - three curved lines -->
  <g stroke="white" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M50,70 Q100,50 150,70"/>
    <path d="M40,100 Q100,75 160,100"/>
    <path d="M50,130 Q100,110 150,130"/>
  </g>
  <!-- BCH diamond -->
  <g transform="translate(100,155)" fill="white">
    <polygon points="0,-12 10,0 0,12 -10,0"/>
  </g>
  <!-- F letter -->
  <text x="100" y="108" font-family="sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">F</text>
</svg>
